# LUMEN — detekt configuration.
# Rules mirror CODING_STANDARDS.md §10. The defaults are built upon; only the
# deviations are listed here.

build:
  maxIssues: 0

complexity:
  CyclomaticComplexMethod:
    active: true
    threshold: 12
  LongMethod:
    active: true
    threshold: 60
  LongParameterList:
    active: true
    functionThreshold: 6
    constructorThreshold: 7
    ignoreDefaultParameters: true
    # A composable takes its state and its callbacks as separate parameters by
    # the Compose convention; the preview default is what makes that readable.
    ignoreAnnotated:
      - "Composable"
    # `AgentRuntime` and `AgentRuntimeFacade` are the loop's composition root:
    # every parameter is a port the run is tested against (brain, environment,
    # policy, approvals, store, ledger, signal, ids). Grouping them into a
    # holder would not shorten the list, it would move it to another
    # constructor, and a test would no longer show which collaborator it is
    # faking. Scoped to those two files so the rule still bites every other
    # class.
    excludes:
      - "**/core/agent/src/main/kotlin/**/AgentRuntime.kt"
      - "**/agent/src/main/kotlin/**/AgentRuntimeFacade.kt"
  TooManyFunctions:
    active: true
    thresholdInFiles: 30
    thresholdInClasses: 30
    thresholdInObjects: 30
    thresholdInEnums: 20
    # CODING_STANDARDS §10 states the per-class cap; a persistence port is a
    # table of operations rather than a class of behaviour.
    thresholdInInterfaces: 16
    ignoreDeprecated: true
    ignorePrivate: false
    ignoreOverridden: true

naming:
  FunctionNaming:
    active: true
    functionPattern: "[a-z][a-zA-Z0-9]*"
    excludeClassPattern: ".*Test$|.*Spec$"
    # A @Composable is named in PascalCase by the Compose convention, which
    # Android Lint's ComposeRule set enforces in the other direction.
    ignoreAnnotated:
      - "Composable"
  TopLevelPropertyNaming:
    active: true
    constantPattern: "[A-Z][_A-Z0-9]*"
    propertyPattern: "[A-Za-z][_A-Za-z0-9]*"
    privatePropertyPattern: "(_)?[A-Za-z][_A-Za-z0-9]*"

style:
  MagicNumber:
    active: true
    ignoreNumbers:
      - "-1"
      - "0"
      - "1"
      - "2"
      - "100"
    ignoreHashCodeFunction: true
    ignorePropertyDeclaration: false
    ignoreConstantDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotation: true
    ignoreNamedArgument: true
    # The quota enums name every number they hold, which is the point of the rule.
    ignoreEnums: true
  MaxLineLength:
    active: true
    maxLineLength: 140
    excludeCommentStatements: true
  ReturnCount:
    active: true
    max: 3
    excludeGuardClauses: true
  WildcardImport:
    active: true
  ForbiddenImport:
    active: true
    # The sandbox is the only module that is allowed to touch the filesystem
    # directly, because it is the only module that mediates every file
    # operation (CODING_STANDARDS.md §6).
    excludes:
      - "**/core/sandbox/**"
      - "**/core/store/**"
    imports:
      - value: "java.lang.Thread"
        reason: "Structured concurrency only (CODING_STANDARDS.md §2)."
      - value: "kotlinx.coroutines.GlobalScope"
        reason: "Every scope has a named owner (CODING_STANDARDS.md §2)."
      - value: "kotlinx.coroutines.Dispatchers.Main"
        reason: "core/* must not touch the main thread; inject a dispatcher."
      - value: "java.io.File"
        reason: "All file I/O goes through SandboxPath (CODING_STANDARDS.md §6)."
      - value: "java.io.FileInputStream"
        reason: "All file I/O goes through SandboxPath (CODING_STANDARDS.md §6)."
      - value: "java.io.FileOutputStream"
        reason: "All file I/O goes through SandboxPath (CODING_STANDARDS.md §6)."
      - value: "kotlin.io.path.*"
        reason: "All file I/O goes through SandboxPath (CODING_STANDARDS.md §6)."
  ForbiddenMethodCall:
    active: true
    methods:
      - value: "println"
        reason: "Use the structured logger (AGENTS.md §6.2)."
      - value: "print"
        reason: "Use the structured logger (AGENTS.md §6.2)."
      - value: "java.lang.Thread"
        reason: "Structured concurrency only (CODING_STANDARDS.md §2)."
      - value: "java.lang.Thread.start"
        reason: "Structured concurrency only (CODING_STANDARDS.md §2)."
      - value: "java.io.File.<init>"
        reason: "All file I/O goes through SandboxPath (CODING_STANDARDS.md §6)."
      - value: "kotlinx.coroutines.runBlocking"
        reason: "Bridge with suspend functions instead (CODING_STANDARDS.md §2)."
      - value: "android.os.Process.setThreadPriority"
        reason: "Nice the process, never the thread priority."
  ForbiddenComment:
    active: true
    allowedPatterns: "TASK\\.md:M[0-9]+"
    comments:
      - reason: "A TODO must name the TASK.md milestone that owns it."
        value: "TODO:"
      - reason: "A FIXME must name the TASK.md milestone that owns it."
        value: "FIXME:"
      - reason: "A STOPSHIP comment must never reach a release build."
        value: "STOPSHIP:"

exceptions:
  TooGenericExceptionCaught:
    active: true
    # `:agent`, `:app` and `:platform` are the process boundaries: an escape
    # there kills the runtime mid-run, which I12 says must not happen, so the
    # boundary catch-all is the design. `core/*` is pure logic and must name
    # what it catches.
    excludes:
      - "**/agent/src/**"
      - "**/app/src/**"
      - "**/platform/**/src/**"
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - "InterruptedException"
      - "CancellationException"

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  LateinitUsage:
    active: true
    # Test classes declare their fixtures with lateinit; the rule is about
    # production lifecycle refs (AGENTS.md §6.2).
    excludes:
      - "**/src/test/**"
      - "**/src/testFixtures/**"
      - "**/src/androidTest/**"

performance:
  SpreadOperator:
    active: false
