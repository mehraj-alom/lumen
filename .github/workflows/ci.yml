name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

jobs:
  android:
    name: Android build and static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            ~/.gradle/caches
          key: ${{ runner.os }}-android-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-android-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Accept licences
        run: yes | sdkmanager --licenses > /dev/null

      - name: Dependency guard
        run: ./gradlew :dependencyGuard :dependencyLedger

      - name: Lint
        run: ./gradlew lint

      - name: Kotlin style
        run: ./gradlew ktlintCheck

      - name: Detekt
        run: ./gradlew detekt

      - name: Unit tests
        run: ./gradlew test

      - name: Assemble
        run: ./gradlew :app:assembleDebug :agent:assembleDebug

  console-web:
    name: Web console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/console-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/console-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  docs:
    name: Specification consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check that every referenced spec file exists
        run: |
          set -euo pipefail
          missing=0
          for f in AGENTS.md CLAUDE.md PRD.md ARCH.md TECHSTACK.md API_SPEC.md STYLE_GUIDE.md CODING_STANDARDS.md TESTING.md TASK.md RE_ANALYSIS.md; do
            if [ ! -f "$f" ]; then echo "missing spec file: $f"; missing=1; fi
          done
          exit $missing
      - name: Check the milestone checklist has no stale markers
        run: |
          set -euo pipefail
          if grep -rn "TODO:" --include="*.md" . | grep -v "TASK.md" | grep -v "must name the TASK.md"; then
            echo "a TODO outside TASK.md must reference a milestone"
            exit 1
          fi
