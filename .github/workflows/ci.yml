name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8

jobs:
  android:
    name: Android build and static analysis
    runs-on: ubuntu-latest
    # Every job in this workflow is capped: the runner bills by the minute and
    # a run that hangs is a run that spends the account's whole monthly budget
    # while nobody is looking.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/sdk
            ~/.gradle/caches
          key: ${{ runner.os }}-android-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-android-

      - name: Install SDK packages
        # The runner image already has the Android SDK and the command-line
        # tools. The setup-android action is deliberately not used: it runs
        # `sdkmanager tools`, and that package no longer exists in
        # cmdline-tools 16, so the action fails before the build starts.
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Compile everything
        # --continue reports the errors of every module in one run. The task
        # names are unqualified, so each runs in every project that has it:
        # production, unit test, fixture and instrumented sources — CI never
        # compiled the instrumented ones, and the emulator job needs them.
        run: >
          ./gradlew compileDebugKotlin
          compileDebugUnitTestKotlin compileTestKotlin compileTestFixturesKotlin
          compileDebugAndroidTestKotlin --continue

      - name: Gate
        # lint, ktlintCheck, detekt, the unit suites, both dependency guards and
        # the debug assembly in one Gradle invocation. Seven cold invocations
        # each pay for configuration and a daemon start and are billed by the
        # minute; one pays once. `--continue` reports every failure in the run
        # rather than stopping at the first task that breaks.
        run: >
          ./gradlew lint ktlintCheck detekt test
          dependencyGuard dependencyLedger :app:assembleDebug
          --continue

      - name: Upload the unit test reports
        # A red run that only says "1 failed" is not readable without the
        # report behind it.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            android/**/build/reports/tests
            android/**/build/test-results
          if-no-files-found: ignore
          retention-days: 14

  apk:
    name: Installable APKs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Deliberately not gated on the `android` job. A lint or detekt finding is a
    # style debt item, not a broken build, and the thing someone wants to put on
    # a phone is the APK: with `needs: android` here, one long line in a
    # composable stops an installable artifact from existing at all.
    needs: []
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        # The runner image already has the Android SDK and the command-line
        # tools. The setup-android action is deliberately not used: it runs
        # `sdkmanager tools`, and that package no longer exists in
        # cmdline-tools 16, so the action fails before the build starts.
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Build the APKs
        # The splits produce one APK per ABI plus a universal one. The arm64
        # APK is the one to install on a modern phone.
        run: ./gradlew :app:assembleDebug

      - name: Collect the APKs
        run: |
          mkdir -p ../artifacts
          find app/build/outputs/apk -name '*.apk' -exec cp {} ../artifacts/ \;
          ls -la ../artifacts/

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: lumen-apks
          path: artifacts/*.apk
          retention-days: 30
          if-no-files-found: error

  device:
    name: Instrumented tests
    runs-on: ubuntu-latest
    # An emulator that cannot boot is not a test failure, it is an hour of
    # billed minutes, and this is the only job in the workflow that can spend
    # that much. The runner's own boot timeout is 600 s; this is the backstop.
    timeout-minutes: 45
    needs: android
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Enable KVM
        # Without /dev/kvm the emulator boots in software mode and the job
        # times out before the first test runs.
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        # API 34 is above the minSdk of 26 and above the RenderEffect floor of
        # 31, so the glass shaders and the accessibility service both run.
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          # The input is `emulator-boot-timeout`; `timeout-boot` is not an input
          # of this action, so it was ignored and the boot kept the default.
          emulator-boot-timeout: 600000
          # The action runs its script from its own `working-directory` input,
          # not from the job's `defaults.run` — and the Gradle root is `android/`,
          # so without this the step looked for ./gradlew in the repo root and
          # failed with 127 before the tests could run.
          working-directory: android
          script: ./gradlew connectedDebugAndroidTest --no-daemon --continue

      - name: Upload the instrumented reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            android/**/build/reports/androidTests
            android/**/build/outputs/androidTest-results
          if-no-files-found: ignore
          retention-days: 14

  console-web:
    name: Web console
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: android/console-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: android/console-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  docs:
    name: Specification consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check that every referenced spec file exists
        run: |
          set -euo pipefail
          missing=0
          for f in AGENTS.md CLAUDE.md PRD.md ARCH.md TECHSTACK.md API_SPEC.md STYLE_GUIDE.md CODING_STANDARDS.md TESTING.md TASK.md RE_ANALYSIS.md OPERATIONS.md RELEASE.md; do
            if [ ! -f "$f" ]; then echo "missing spec file: $f"; missing=1; fi
          done
          exit $missing
      - name: Check the milestone checklist has no stale markers
        run: |
          set -euo pipefail
          if grep -rn "TODO:" --include="*.md" . | grep -v "TASK.md" | grep -v "must name the TASK.md"; then
            echo "a TODO outside TASK.md must reference a milestone"
            exit 1
          fi
